import com.google.gson.Gson
import com.google.gson.JsonArray
import net.fabricmc.loom.api.mappings.layered.MappingsNamespace

import java.nio.charset.StandardCharsets
import java.nio.file.Files

buildscript {
    apply from: rootProject.file("x_build/depend/github_depend.gradle")

    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }

        flatDir {
            dirs "libs-all"
        }

        gradlePluginPortal()
    }

    dependencies {
        classpath 'net.fabricmc:fabric-loom:1.17-SNAPSHOT'
        classpath github("Olafcio1/LimePublishing")
        classpath 'com.gradleup.shadow:shadow-gradle-plugin:9.6.1'
    }
}

boolean contains(String value) {
    return value in project.getProperties()
}

var final boolean neoforge = contains("neoforge")
var final boolean sponge   = contains("sponge")
var final boolean paper    = contains("paper")
var final boolean quilt    = contains("quilt")
var final boolean fabric   = !neoforge && !sponge && !paper && !quilt

ext {
    it.neoforge = neoforge
    it.sponge = sponge
    it.fabric = fabric
    it.paper = paper
    it.quilt = quilt
}

if (sponge) {
    apply plugin: 'com.gradleup.shadow'
}

if (contains("omit_mappings")) {
    apply plugin: 'net.fabricmc.fabric-loom'
} else {
    apply plugin: 'fabric-loom'
}

apply plugin: 'maven-publish'
apply plugin: 'lime-publishing'

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    if (!paper)
        accessWidenerPath = rootProject.file("src/main/resources/avoidlib.accesswidener")

    if ("dev_mappings" in project.getProperties()) {
        noIntermediateMappings()
        useIntermediateMappings.set(false)
        productionNamespace.set(project.getProperties().dev_mappings == "OBFUSCATED" ? MappingsNamespace.NAMED.toString() : MappingsNamespace.OFFICIAL.toString())
        remapConfigurations.clear()
        intermediaryMinecraftProvider = null
        // Wow it works but why the fuck did i have to do those undocumented things
    }

    runs {
        it.forEach {
            it.getJvmArguments().add("-XX:StackShadowPages=32")
        }
    }
}

repositories {
    maven {
        name 'jitpack'
        url 'https://jitpack.io/'
    }

    if (sponge) {
        maven {
            name 'spongepowered'
            url 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }

    if (paper) {
        maven {
            name 'papermc'
            url 'https://repo.papermc.io/repository/maven-public/'
        }
    }

    if (quilt) {
        maven {
            name 'quiltmc'
            url 'https://maven.quiltmc.org/repository/release/'
        }
    }

    if (!paper) {
        maven {
            url "https://maven.nucleoid.xyz/"
            name "Nucleoid"
        }
    } else {
        maven {
            url "https://repo.extendedclip.com/releases/"
            name "ExtendedClip"
        }
    }
}

if (sponge) {
    shadowJar {
        configurations = [project.configurations.shadow]
        relocate("com.llamalad7.mixinextras", "pl.olafcio.avoid.__shadow__.mixinextras")
        mergeServiceFiles() // Very important!
    }
}

apply from: project.file('x_build/env_processing.gradle')

if (neoforge) {
    replaceEnvAnnot("net.neoforged.api.distmarker.OnlyIn", "net.neoforged.api.distmarker.Dist")
} else if (paper) {
    replaceEnvAnnot("pl.olafcio.avoid.annotations.dist.OnlyIn", "pl.olafcio.avoid.annotations.dist.Dist")
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    final var append = obj -> (fabric) ? include(obj) : shadow(obj)
    final var mod = obj -> ("omit_mappings" !in project.getProperties()) ? modImplementation(obj) : implementation(obj)

    if ("include_jspecify" in project.getProperties()) {
        implementation(append("org.jspecify:jspecify:1.0.1"))
    }

    if ("omit_mappings" !in project.getProperties()) {
        mappings loom.officialMojangMappings()
    }

    if (sponge) {
        compileOnly fileTree(rootProject.file("libs/sponge"))

        compileOnly "org.spongepowered:mixin:0.8.7"
        compileOnly "io.github.llamalad7:mixinextras-common:0.5.4"

        compileOnly "org.ow2.asm:asm:9.8"
        compileOnly "org.ow2.asm:asm-tree:9.8"

        append(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.4"))
    } else if (neoforge) {
        compileOnly fileTree(rootProject.file("libs/neoforge"))

        compileOnly "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
        compileOnly "io.github.llamalad7:mixinextras-fabric:0.5.4"
    } else if (paper) {
        implementation ("omit_mappings" in project.getProperties() ? "io.papermc.paper:paper-api:${project.minecraft_version}.build.+" : "io.papermc.paper:paper-api:${project.minecraft_version}-R0.1-SNAPSHOT")
    } else if (quilt) {
        implementation "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
        implementation "io.github.llamalad7:mixinextras-fabric:0.5.4"

        implementation "org.ow2.asm:asm:9.10.1"
        implementation "org.ow2.asm:asm-tree:9.10.1"
        implementation "org.ow2.asm:asm-util:9.10.1"
        implementation "org.ow2.asm:asm-commons:9.10.1"

        mod "org.quiltmc:quilt-json5:1.0.4+final"
        mod "org.quiltmc:quilt-config:1.3.3"
        mod "org.quiltmc:quilt-loader:${project.quilt_loader}"

        if ("omit_mappings" !in project.getProperties())
            modCompileOnly("net.fabricmc:fabric-loader:${project.loader_version}")
        else
            compileOnly("net.fabricmc:fabric-loader:${project.loader_version}")
    } else {
        mod "net.fabricmc:fabric-loader:${project.loader_version}"
    }

    var versionLibs = rootProject.file("libs/${project.minecraft_version}")
    if (versionLibs.isDirectory()) {
        mod fileTree(versionLibs)
    }

    if ("include_permapi" in project.getProperties()) {
        mod "me.lucko:fabric-permissions-api:${project.include_permapi}"
    }

    if (paper) {
        compileOnly "me.clip:placeholderapi:2.12.3"
    } else if (project.text_papi_version != '-') {
        mod "eu.pb4:placeholder-api:${project.text_papi_version}"
    }
}

apply from: project.file('x_build/loaders.gradle')
apply from: project.file('x_build/merger.gradle')

if (contains("merge")) {
    scheduleMerging()
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "minecraft_version_range", ('minecraft_version_range' in project.properties ? project.minecraft_version_range : project.minecraft_version)
    inputs.property "loader_version", project.loader_version
    inputs.property "quilt_loader", project.quilt_loader

    if ('neo_version' in project.properties) {
        inputs.property "neo_version", project.neo_version
    }

    filteringCharset "UTF-8"
    filesMatching([".version", "fabric.mod.json", "quilt.mod.json", "paper-plugin.yml", "META-INF/neoforge.mods.toml", "META-INF/sponge_plugins.json"]) {
        expand inputs.properties
    }
}

def targetJavaVersion = Integer.parseInt((String) project.property("java_version"))

tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.

    it.options.encoding = "UTF-8"

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)

    if (System.getProperty("gen_sources") != null)
        withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }

    if (sponge) {
        manifest {
            from 'src/main/resources/META-INF/MANIFEST.MF'
        }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

import pl.olafcio.limepublish.enums.Environment
import pl.olafcio.limepublish.enums.VersionType
import pl.olafcio.limepublish.enums.Platform

release {
    name           "Avoid v${project.version} [${minecraft_version}]"
    version_number project.version
    version_type   ("alpha" in project.getProperties() ? VersionType.ALPHA : VersionType.STABLE)
    environment    Environment.CLIENT_OR_SERVER_PREFERS_BOTH
    changelog      Files.readString(rootProject.file("CHANGELOG").toPath())

    if ("minecraft_version_list" !in project.getProperties())
        minecraft = [minecraft_version]
    else
        minecraft = new Gson().fromJson((String) project.minecraft_version_list, JsonArray.class).asList() \
                              .collect { e -> e.getAsString() }

    files {
        main = (
                "shadow" in project.getProperties()
                        ? shadowJar.archiveFile.get().asFile
                        :
                "merge" in project.getProperties()
                        ? getMergeJAR()
                        :
                "omit_mappings" !in project.getProperties()
                        ? remapJar.archiveFile.get().asFile
                        : jar     .archiveFile.get().asFile
        ).toPath()
    }

    var loaders = getPublicLoaders()
    var platformList = new ArrayList<Platform>()

    for (String loader : loaders)
        platformList.add(Platform.valueOf(loader.toUpperCase()))

    it.setPlatforms(platformList)

    if (minecraft_version.startsWith("1.") && minecraft_version != "1.21.11") {
        requires {
            project "backported-attr"
        }
    }

    if (contains("include_permapi")) {
        optional {
            project "fabric-permissions-api"
        }
    }

    if (paper) {
        optional {
            project "placeholderapi"
        }
    } else {
        optional {
            project "placeholder-api"
        }
    }

    modrinth {
        slug  "avoid"
        token providers.environmentVariable("MODRINTH_API_KEY")
    }
}

tasks.register("considerRelease") {
    dependsOn build

    if (contains("merge") || contains("publish"))
        dependsOn("release")
}

apply from: project.file('x_build/lib_github.gradle')

tasks.register("publishGitHub") {
    dependsOn build

    doLast {
        try (var client = createGitHubClient(providers.environmentVariable("GITHUB_TOKEN").get())) {
            var hashproc = new ProcessBuilder().command("git", "log", "origin/main", "-1", "--format=%H")
                                                        .start()

            hashproc.waitFor()

            client.createTag(
                    tag: "v${project.version}",
                    hash: new String(hashproc.in.readAllBytes(), StandardCharsets.UTF_8).substring(0, 40),
                    message: Files.readString(rootProject.file("CHANGELOG").toPath(), StandardCharsets.UTF_8)
            )

            var id = client.createRelease(
                    tag: "v${project.version}",
                    branch: "main",
                    name: "v${project.version}",
                    message: Files.readString(rootProject.file("CHANGELOG").toPath(), StandardCharsets.UTF_8)
            )

            client.uploadRelease(
                    name: "AvoidLib%2Bfabric-1.21.11.jar",
                    file: (contains("omit_mappings") ? jar : remapJar).archiveFile.get().asFile.toPath(),
                    release: id
            )

            client.uploadRelease(
                    name: "AvoidLib%2Bfabric-1.21.11-sources.jar",
                    file: project.file("build/devlibs/avoidlib-${version}-sources.jar").toPath(),
                    release: id
            )
        }
    }
}
