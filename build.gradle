import com.google.gson.Gson
import com.google.gson.JsonObject
import com.google.gson.JsonArray

import groovy.json.JsonOutput

import java.net.http.HttpClient
import java.net.http.HttpRequest
import java.net.http.HttpResponse
import java.nio.charset.StandardCharsets
import java.nio.file.Files
import java.util.function.Consumer
import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream;

buildscript {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }

        gradlePluginPortal()
    }

    dependencies {
        classpath 'net.fabricmc:fabric-loom:1.17-SNAPSHOT'
        classpath 'me.modmuss50:mod-publish-plugin:2.0.0'
        classpath 'com.gradleup.shadow:shadow-gradle-plugin:9.6.1'
    }
}

boolean contains(String value) {
    return value in project.getProperties()
}

var final boolean neoforge = contains("neoforge")
var final boolean sponge   = contains("sponge")
var final boolean fabric   = !neoforge && !sponge

ext {
    it.neoforge = neoforge
    it.sponge = sponge
    it.fabric = fabric
}

if (sponge) {
    apply plugin: 'com.gradleup.shadow'
}

if (contains("omit_mappings")) {
    apply plugin: 'net.fabricmc.fabric-loom'
} else {
    apply plugin: 'fabric-loom'
}

apply plugin: 'maven-publish'
apply plugin: 'me.modmuss50.mod-publish-plugin'

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    accessWidenerPath = rootProject.file("src/main/resources/avoidlib.accesswidener")
}

repositories {
    maven {
        name 'jitpack'
        url 'https://jitpack.io/'
    }
}

if (sponge) {
    shadowJar {
        configurations = [project.configurations.shadow]
        relocate("com.llamalad7.mixinextras", "pl.olafcio.avoid.__shadow__.mixinextras")
        mergeServiceFiles() // Very important!
    }
}

if (neoforge) {
    tasks.compileJava.doFirst {
        var src = rootProject.file("src/main/java").toPath()

        var walk = new Consumer<java.nio.file.Path>[2]

        walk[0] = new Consumer<java.nio.file.Path>() {
            @Override
            void accept(java.nio.file.Path path) {
                try (var files = Files.list(path)) {
                    files.forEach(sub -> {
                        if (Files.isDirectory(sub)) {
                            walk[0].accept(sub)
                        } else if (sub.getFileName().toString().endsWith(".java")) {
                            Files.writeString(sub, Files.readString(sub, StandardCharsets.UTF_8) \
                                                        .replace("net.fabricmc.api.Environment", "net.neoforged.api.distmarker.OnlyIn") \
                                                        .replace("net.fabricmc.api.EnvType", "net.neoforged.api.distmarker.Dist") \
                                                        .replace("@Environment(EnvType.", "@OnlyIn(Dist."), StandardCharsets.UTF_8)
                        }
                    })
                }
            }
        }

        walk[0].accept(src)
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    final var append = obj -> (fabric) ? include(obj) : shadow(obj)
    final var mod = obj -> ("omit_mappings" !in project.getProperties()) ? modImplementation(obj) : implementation(obj)

    if ("include_jspecify" in project.getProperties()) {
        implementation(append("org.jspecify:jspecify:1.0.1"))
    }

    if ("omit_mappings" !in project.getProperties()) {
        mappings loom.officialMojangMappings()
    }

    if (sponge) {
        compileOnly fileTree(rootProject.file("libs/sponge"))

        compileOnly "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
        compileOnly "io.github.llamalad7:mixinextras-common:0.5.4"

        append(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.4"))
    } else if (neoforge) {
        compileOnly fileTree(rootProject.file("libs/neoforge"))

        compileOnly "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
        compileOnly "io.github.llamalad7:mixinextras-fabric:0.5.4"
    } else {
        mod "net.fabricmc:fabric-loader:${project.loader_version}"
    }

    var versionLibs = rootProject.file("libs/${project.minecraft_version}")
    if (versionLibs.isDirectory()) {
        mod fileTree(versionLibs)
    }

    if ("include_permapi" in project.getProperties()) {
        mod "me.lucko:fabric-permissions-api:${project.include_permapi}"
    }
}

private List<String> getLoaders() {
    if (contains("merge"))
        return new Gson().fromJson((String) project.merge, JsonArray.class).asList() \
                         .collect { e -> e.getAsString() }
    else if (ext.fabric)
        return ["fabric"];
    else if (ext.neoforge)
        return ["neoforge"];
    else if (ext.sponge)
        return ["sponge"];
    else
        return [];
}

private File getMergeJAR() {
    var loaders = getLoaders()
    return rootProject.file("build/libs/avoidlib+${String.join("+", loaders)}-${project.minecraft_version}-${project.version}.jar")
}

if (contains("merge")) {
    var mergeJAR = getMergeJAR()

    tasks.build.doLast {
        var paths = [
                "fabric":   rootProject.file("build/libs/avoidlib+" +     "${project.minecraft_version}-${project.version}.jar"),
                "neoforge": rootProject.file("build/libs/avoidlib+neoforge-${project.minecraft_version}-${project.version}.jar")
        ]

        final var loaders = getLoaders()
        final var merge = loaders.collect { e -> paths[e] }

        var bos = new ByteArrayOutputStream()
        var zos = new ZipOutputStream(bos)

        zos.putNextEntry(new ZipEntry("assets/avoid_bundler/icon.png"))

        try (var zip = new ZipFile(merge[0])) {
            byte[] data

            try (var src = zip.getInputStream(zip.getEntry("assets/avoidlib/icon.png"))) {
                data = src.readAllBytes()
            }

            zos.write(data)
        }

        int i = 0
        for (var file : merge) {
            zos.putNextEntry(new ZipEntry("jars/avoid-" + loaders[i++] + ".jar"))

            var data = Files.readAllBytes(file.toPath())
            zos.write(data)
        }

        if ("fabric" in loaders) {
            zos.putNextEntry(new ZipEntry("fabric.mod.json"))
            zos.write(JsonOutput.toJson([
                "schemaVersion": 1,
                "id": "avoid_bundler",
                "version": "${version}",
                "name": "Avoid",
                "description": "Yet another library for everything Minecraft. Kinda like Bukkit.",
                "authors": [ "Olafcio" ],
                "contact": Map.of(),
                "license": "Apache-2.0",
                "icon": "assets/avoid-bundler/icon.png",
                "environment": "*",
                "entrypoints": [
                    "client": [],
                    "main": []
                ],
                "mixins": [],
                "depends": Map.of(),
                "jars": [
                    [
                        "file": "jars/avoid-fabric.jar"
                    ]
                ]
            ]).getBytes(StandardCharsets.UTF_8))
        }

        if ("neoforge" in loaders) {
            zos.putNextEntry(new ZipEntry("META-INF/neoforge.mods.toml"))
            zos.write("""
license="Apache License 2.0"
issueTrackerURL="https://github.com/AvoidLib/Avoid/issues"

[[mods]]
modId="avoid_bundler"
version="${version}"
displayName="Avoid"
logoFile="assets/avoid_bundler/icon.png"
authors="Olafcio"
description='''
Yet another library for everything Minecraft. Kinda like Bukkit.
'''

""".trim().getBytes(StandardCharsets.UTF_8))

            zos.putNextEntry(new ZipEntry("META-INF/jarjar/metadata.json"))
            zos.write(JsonOutput.toJson([
                "jars": [
                    [
                        "identifier": [
                            "group": "pl.olafcio",
                            "artifact": "avoid"
                        ],
                        "version": [
                            "range": "[${project.version},)",
                            "artifactVersion": "${project.version}"
                        ],
                        "path": "jars/avoid-neoforge.jar",
                        "isObfuscated": false
                    ]
                ]
            ]).getBytes(StandardCharsets.UTF_8))
        }

        zos.close()

        Files.write(mergeJAR.toPath(), bos.toByteArray())
        bos.close()
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "minecraft_version_range", ('minecraft_version_range' in project.properties ? project.minecraft_version_range : project.minecraft_version)
    inputs.property "loader_version", project.loader_version

    if ('neo_version' in project.properties) {
        inputs.property "neo_version", project.neo_version
    }

    filteringCharset "UTF-8"
    filesMatching(["fabric.mod.json", "META-INF/neoforge.mods.toml", "META-INF/sponge_plugins.json"]) {
        expand inputs.properties
    }
}

def targetJavaVersion = Integer.parseInt((String) project.property("java_version"))

tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.

    it.options.encoding = "UTF-8"

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)

    if (System.getProperty("gen_sources") != null)
        withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

publishMods {
    file = "omit_mappings" !in project.getProperties() ? remapJar.archiveFile : jar.archiveFile
    changelog = Files.readString(rootProject.file("CHANGELOG").toPath())
    type = STABLE

    var loaders = getLoaders()
    for (String loader : loaders)
        modLoaders.add(loader)

    modrinth {
        displayName = "Avoid v${project.version} [${minecraft_version}]"
        accessToken = providers.environmentVariable("MODRINTH_API_KEY")
        projectId = "LitgU0gE"

        if ("minecraft_version_list" !in project.getProperties())
            minecraftVersions.add(minecraft_version)
        else
            minecraftVersions.addAll(new Gson().fromJson((String) project.minecraft_version_list, JsonArray.class).asList() \
                                               .collect { e -> e.getAsString() })

//        setAdditionalFiles(files(("omit_mappings" !in project.getProperties() ? remapSourcesJar.archiveFile : sourcesJar.archiveFile).get().asFile.toPath()))
    }
}

tasks.register("release") {
    dependsOn build

    if (contains("merge") || contains("release"))
        dependsOn("publishMods")
}

tasks.register("publishGitHub") {
    dependsOn build

    doLast {
        try (var client = HttpClient.newHttpClient()) {
            var hashproc = new ProcessBuilder().command("git", "log", "origin/main", "-1", "--format=%H")
                                                        .start()

            hashproc.waitFor()

            var data2 = JsonOutput.toJson([
                "tag": "v${project.version}",
                "object": new String(hashproc.in.readAllBytes(), StandardCharsets.UTF_8).substring(0, 40),
                "type": "commit",
                "message": Files.readString(rootProject.file("CHANGELOG").toPath(), StandardCharsets.UTF_8)
            ])

            client.send(HttpRequest.newBuilder()
                                   .method("POST", HttpRequest.BodyPublishers.ofString(data2, StandardCharsets.UTF_8))
                                   .uri(URI.create("https://api.github.com/repos/AvoidLib/Avoid/git/tags"))
                                   .header("Accept", "application/vnd.github+json")
                                   .header("Authorization", "Bearer " + providers.environmentVariable("GITHUB_TOKEN").get())
                                   .header("X-GitHub-Api-Version", "2026-03-10")
                                   .build(), HttpResponse.BodyHandlers.discarding())

            var data1 = JsonOutput.toJson([
                "tag_name": "v${project.version}",
                "target_commitish": "main",
                "name": "v${project.version}",
                "body": Files.readString(rootProject.file("CHANGELOG").toPath(), StandardCharsets.UTF_8),
                "make_latest": "true"
            ])

            var respraw = client.send(HttpRequest.newBuilder()
                                        .method("POST", HttpRequest.BodyPublishers.ofString(data1, StandardCharsets.UTF_8))
                                        .uri(URI.create("https://api.github.com/repos/AvoidLib/Avoid/releases"))
                                        .header("Accept", "application/vnd.github+json")
                                        .header("Authorization", "Bearer " + providers.environmentVariable("GITHUB_TOKEN").get())
                                        .header("X-GitHub-Api-Version", "2026-03-10")
                                        .build(), HttpResponse.BodyHandlers.ofByteArray()).body()

            var resp = new Gson().fromJson(
                    new String(respraw, StandardCharsets.UTF_8),
                    JsonObject.class
            )

            client.send(HttpRequest.newBuilder()
                                   .method("POST", HttpRequest.BodyPublishers.ofFile((contains("omit_mappings") ? jar : remapJar).archiveFile.get().asFile.toPath()))
                                   .uri(URI.create("https://uploads.github.com/repos/AvoidLib/Avoid/releases/${resp['id']}/assets?name=AvoidLib+fabric-1.21.11.jar"))
                                   .header("Accept", "application/vnd.github+json")
                                   .header("Authorization", "Bearer " + providers.environmentVariable("GITHUB_TOKEN").get())
                                   .header("X-GitHub-Api-Version", "2026-03-10")
                                   .header("Content-Type", "application/octet-stram")
                                   .build(), HttpResponse.BodyHandlers.discarding())

            client.send(HttpRequest.newBuilder()
                                   .method("POST", HttpRequest.BodyPublishers.ofFile((contains("omit_mappings") ? sourcesJar : remapSourcesJar).archiveFile.get().asFile.toPath()))
                                   .uri(URI.create("https://uploads.github.com/repos/AvoidLib/Avoid/releases/${resp['id']}/assets?name=AvoidLib+fabric-1.21.11-sources.jar"))
                                   .header("Accept", "application/vnd.github+json")
                                   .header("Authorization", "Bearer " + providers.environmentVariable("GITHUB_TOKEN").get())
                                   .header("X-GitHub-Api-Version", "2026-03-10")
                                   .header("Content-Type", "application/octet-stram")
                                   .build(), HttpResponse.BodyHandlers.discarding())

        }
    }
}
