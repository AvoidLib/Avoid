import java.nio.file.Files
import java.util.function.Predicate

apply from: rootProject.file("x_build/api/github_api.gradle")

String github(String repository, String versionName = "latest", Predicate<String> jarFinder = { _ -> true }, Predicate<String> sourcesJarFinder = { _ -> false }, String suffix = "") {
    var repoName = repository.substring(repository.indexOf("/") + 1)
    var libs = project.file("libs-all").toPath()

    Files.createDirectories(libs)

    String left = null

    if (versionName == "latest") {
        try (var allLibs = Files.list(libs)) {
            String ret = null

            allLibs.forEach {
                def fn = it.getFileName().toString()
                if (fn.startsWith(repoName + "-") && fn.endsWith(suffix + ".jar")) {
                    if (System.currentTimeMillis() - Files.getLastModifiedTime(it).toMillis() < 1000*60*60*24*3 && !gradle.startParameter.offline) {
                        left = ":" + repoName + suffix + ":" + fn.substring(0, fn.length() - 4).split("-", 2)[1]
                    } else {
                        ret = ":" + repoName + suffix + ":" + fn.substring(0, fn.length() - 4).split("-", 2)[1]
                    }
                }
            }

            if (ret != null)
                return ret
        }
    } else {
        if (libs.resolve(repoName + suffix + "-" + versionName + ".jar").toFile().isFile())
            return ":" + repoName + suffix + ":" + versionName
    }

    var version

    try {
        version = github_getRelease(repository, versionName)
    } catch (Throwable e) {
        if (left != null)
            return left

        throw e
    }

    var repoVersion = version['tag_name']

    var jar = libs.resolve(repoName + suffix + "-" + repoVersion + ".jar")
    var jarSources = libs.resolve(repoName + suffix + "-" + repoVersion + "-sources.jar")

    for (var asset : version['assets']) {
        if (jarFinder(asset['name'])) {
            URI.create(asset['browser_download_url'] as String) \
               .toURL() \
               .withInputStream { i -> jar.withOutputStream { it << i }}

            break
        }
    }

    for (var asset : version['assets']) {
        if (sourcesJarFinder(asset['name'])) {
            URI.create(asset['browser_download_url'] as String) \
               .toURL() \
               .withInputStream { i -> jarSources.withOutputStream { it << i }}

            break
        }
    }

    return ":" + repoName + suffix + ":" + repoVersion
}

String github(kwargs, repository) {
    return github(
            (String)repository,
            'versionName' in kwargs ? (String)kwargs['versionName'] : "latest",
            'jarFinder' in kwargs ? (Predicate<String>)kwargs['jarFinder'] : { _ -> true },
            'sourcesJarFinder' in kwargs ? (Predicate<String>)kwargs['sourcesJarFinder'] : { _ -> false },
            'suffix' in kwargs ? (String)kwargs['suffix'] : ""
    )
}

ext {
    github = this.&github
}
